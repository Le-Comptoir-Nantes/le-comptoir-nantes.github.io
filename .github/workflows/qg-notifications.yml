# QG du Comptoir : envoie les notifications (annonces, rendez-vous, rappels 2 h avant) aux appareils inscrits.
# Toutes les 5 minutes (GitHub peut décaler un passage de quelques minutes). Ne publie rien sur le site.
# Il lui faut le secret QG_FIREBASE_SA (clé du compte de service Firebase) : sans lui, il ne fait rien.
name: QG - notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qg-notifications
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le script
        run: git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" site
      - name: Installer les bibliothèques Google
        run: python3 -m pip install --quiet --disable-pip-version-check google-auth==2.35.0 requests==2.32.3
      - name: Vérifier le calcul des notifications
        run: python3 site/outils/qg/test_notifier.py
      - name: Envoyer les notifications
        env:
          QG_FIREBASE_SA: ${{ secrets.QG_FIREBASE_SA }}
        run: python3 site/outils/qg/notifier.py
