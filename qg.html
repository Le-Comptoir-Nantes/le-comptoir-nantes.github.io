<header class="band">

      <img src="assets/favicon.svg" width="40" height="40" alt="">

      <button class="btn small logout" id="logoutBtn" type="button" hidden>Déconnexion</button>
    </div>
    <section class="now" id="now" aria-live="polite"></section>
    <div class="strip" id="strip"></div>
  </div>
</header>

<main><div class="wrap notifwrap" id="notifWrap" hidden><div id="notifBar"></div></div><div class="wrap" id="view"></div></main>

    <button role="tab" data-tab="annonces" id="tab-annonces"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l7 4V6L7 10z"/><path d="M17.5 9a4 4 0 0 1 0 6"/></svg>Annonces</button>
    <button role="tab" data-tab="revisions" id="tab-revisions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>Révisions</button>

<div id="sheetRoot"></div>
